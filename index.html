<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Now Page</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="bg-orb bg-orb-1" aria-hidden="true"></div>
  <div class="bg-orb bg-orb-2" aria-hidden="true"></div>

  <main class="container">
    <header class="header">
      <p class="kicker">Live Academic Notice Board</p>
      <h1>Now Page</h1>
      <p class="subtitle">BITS MTech AIML S2-25 Batch</p>
      <div class="meta-row">
        <p id="clock-text">Using IST (Asia/Kolkata) time</p>
        <p id="last-updated">Last refreshed: Loading...</p>
        <p id="sheet-last-changed">Last updated (sheet): Loading...</p>
      </div>
    </header>

    <section aria-labelledby="active-heading" class="section active-section">
      <div class="section-head">
        <span class="status-dot" aria-hidden="true"></span>
        <h2 id="active-heading">Currently Active</h2>
      </div>
      <div id="active-events" class="cards"></div>
    </section>

    <section id="upcoming-section" aria-labelledby="upcoming-heading" class="section">
      <div class="section-head">
        <h2 id="upcoming-heading">Upcoming</h2>
        <p class="section-note">Up to 2 events</p>
      </div>
      <div id="upcoming-events" class="cards compact"></div>
    </section>

    <section id="passed-section" aria-labelledby="passed-heading" class="section">
      <div class="section-head">
        <h2 id="passed-heading">Recently Passed</h2>
        <p class="section-note">Up to 2 events</p>
      </div>
      <div id="passed-events" class="cards compact"></div>
    </section>

    <section id="error-box" class="error-box hidden" aria-live="polite"></section>
  </main>

  <script src="app.js"></script>
</body>
</html>
